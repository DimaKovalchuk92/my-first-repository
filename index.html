<!DOCTYPE html>
<html>
<head>
    <title>Мой анимированный сайт</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 80px;
            gap: 16px;
            background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        .emoji {
            font-size: 100px;
            cursor: pointer;
        }
        /* Анимация подмигивания */
        @keyframes wink {
            0%, 100% { content: "😉"; }
            50% { content: "🙂"; }
        }
        .emoji::after {
            content: "😉";
            animation: wink 2s infinite;
        }
        /* Бургер-кнопка */
        .burger {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.25));
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1100;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .burger:hover {
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.3));
        }
        .burger-line {
            position: relative;
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: #ffffff;
            transition: background 0.2s ease;
        }
        .burger-line::before,
        .burger-line::after {
            content: "";
            position: absolute;
            left: 0;
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: #ffffff;
            transition: transform 0.25s ease, top 0.25s ease, opacity 0.25s ease;
        }
        .burger-line::before {
            top: -6px;
        }
        .burger-line::after {
            top: 6px;
        }
        .burger.open .burger-line {
            background: transparent;
        }
        .burger.open .burger-line::before {
            top: 0;
            transform: rotate(45deg);
        }
        .burger.open .burger-line::after {
            top: 0;
            transform: rotate(-45deg);
        }
        /* Боковое меню */
        .side-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            height: 100vh;
            padding: 80px 24px 24px;
            background: rgba(14, 10, 40, 0.9);
            backdrop-filter: blur(24px);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1090;
        }
        .side-menu.open {
            transform: translateX(0);
        }
        .side-menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .side-menu a {
            color: #f5f5ff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.03em;
            padding: 8px 0;
            display: inline-block;
            position: relative;
        }
        .side-menu a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ffd700, #ff69b4, #00f5ff);
            transition: width 0.25s ease;
        }
        .side-menu a:hover::after {
            width: 100%;
        }
        /* Модальное окно контактов */
        .contacts-modal-backdrop {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(6, 3, 24, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 1200;
        }
        .contacts-modal-backdrop.open {
            opacity: 1;
            visibility: visible;
        }
        .contacts-modal {
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.1), rgba(10, 5, 40, 0.96));
            border-radius: 24px;
            padding: 24px 28px 20px;
            max-width: 360px;
            width: calc(100% - 48px);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.75);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .contacts-modal h2 {
            margin: 0 0 12px;
            font-size: 22px;
        }
        .contacts-modal p {
            margin: 0 0 18px;
            font-size: 14px;
            opacity: 0.9;
        }
        .contacts-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
        }
        .contacts-icon {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 22px;
            color: #ffffff;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .contacts-icon:hover {
            transform: translateY(-2px) scale(1.03);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .contacts-close-btn {
            margin-top: 4px;
            padding: 8px 18px;
            border-radius: 999px;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            color: #3b2f8f;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .contacts-close-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
            background: #ffffff;
        }
        .contacts-close-btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
        }
        /* Кнопка частиц */
        .particle-btn {
            margin-top: 24px;
            padding: 14px 32px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: #667eea;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .particle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.2);
        }
        .particle-btn:active {
            transform: translateY(0);
        }
        /* Контейнер частиц — поверх контента, но клики проходят сквозь */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            font-size: 12px;
            opacity: 0.9;
            animation: particle-fly linear forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.35),
                         1px 1px 2px rgba(0, 0, 0, 0.25);
        }
        @keyframes particle-fly {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="burger" id="burger">
        <div class="burger-line"></div>
    </div>

    <nav class="side-menu" id="sideMenu">
        <ul>
            <li><a href="#top">Главная</a></li>
            <li><a href="#about">Обо мне</a></li>
            <li><a href="#skills">Навыки</a></li>
            <li><a href="#contacts">Контакты</a></li>
        </ul>
    </nav>

    <main id="top">
        <h1>Ура! Мой CI/CD работает!</h1>
        <div class="emoji"></div>
        <p>Смайлик подмигивает сам по себе каждые 2 секунды.</p>
        <button class="particle-btn">✨ Запустить конфетти</button>
    </main>

    <div class="contacts-modal-backdrop" id="contactsModal">
        <div class="contacts-modal">
            <h2>Свяжитесь со мной</h2>
            <p>Выберите удобный способ связи — я буду рад вашему сообщению.</p>
            <div class="contacts-icons">
                <a class="contacts-icon" href="https://t.me/your_telegram" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                    &#128227;
                </a>
                <a class="contacts-icon" href="mailto:you@example.com" aria-label="Email">
                    &#9993;
                </a>
            </div>
            <button class="contacts-close-btn" id="contactsModalClose">Закрыть</button>
        </div>
    </div>

    <div class="particles-container" id="particlesContainer"></div>

    <script>
        const particlesContainer = document.getElementById('particlesContainer');
        const particleChars = ['✦', '✧', '★', '☆', '•', '◆', '◇'];
        const colors = ['#ffd700', '#ff69b4', '#00f5ff', '#e0c3fc', '#fff', '#ff9a9e', '#a8edea'];

        const burger = document.getElementById('burger');
        const sideMenu = document.getElementById('sideMenu');
        const contactsModal = document.getElementById('contactsModal');
        const contactsModalClose = document.getElementById('contactsModalClose');
        const contactsLink = sideMenu.querySelector('a[href="#contacts"]');

        burger.addEventListener('click', () => {
            burger.classList.toggle('open');
            sideMenu.classList.toggle('open');
        });

        sideMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('open');
                sideMenu.classList.remove('open');
            });
        });

        function openContactsModal() {
            contactsModal.classList.add('open');
        }

        function closeContactsModal() {
            contactsModal.classList.remove('open');
        }

        if (contactsLink) {
            contactsLink.addEventListener('click', (event) => {
                event.preventDefault();
                openContactsModal();
            });
        }

        contactsModalClose.addEventListener('click', () => {
            closeContactsModal();
        });

        contactsModal.addEventListener('click', (event) => {
            if (event.target === contactsModal) {
                closeContactsModal();
            }
        });

        document.querySelector('.particle-btn').addEventListener('click', () => {
            for (let i = 0; i < 50; i++) {
                createParticle();
            }
        });

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = particleChars[Math.floor(Math.random() * particleChars.length)];
            particle.style.left = '50%';
            particle.style.top = '50%';
            particle.style.color = colors[Math.floor(Math.random() * colors.length)];
            const angle = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 250;
            const dx = Math.cos(angle) * dist;
            const dy = Math.sin(angle) * dist;
            particle.style.setProperty('--dx', dx + 'px');
            particle.style.setProperty('--dy', dy + 'px');
            particle.style.animationDuration = (2 + Math.random() * 1.5) + 's';
            particle.style.animationDelay = Math.random() * 0.2 + 's';

            particlesContainer.appendChild(particle);
            setTimeout(() => particle.remove(), 4000);
        }
    </script>
</body>
</html>
